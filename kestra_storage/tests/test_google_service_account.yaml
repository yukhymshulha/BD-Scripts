id: test_google_service_account
namespace: company.team
description: "Тест авторизації Google Service Account"

tasks:
  - id: testGoogleAuth
    type: io.kestra.plugin.scripts.python.Script
    description: "Автентифікація та перевірка Google Drive API"

    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: python:3.11

    beforeCommands:
      - pip install --no-cache-dir google-auth google-api-python-client

    inputFiles:
      google-sa.json: "{{ secret('GOOGLE_SA_JSON') }}"

    script: |
      import json
      from google.oauth2 import service_account
      from googleapiclient.discovery import build

      print("Starting Google Auth Test...")

      with open('google-sa.json', 'r') as f:
          creds_info = json.load(f)

      print("Service Account Email:", creds_info.get('client_email'))

      credentials = service_account.Credentials.from_service_account_info(
          creds_info,
          scopes=['https://www.googleapis.com/auth/drive.readonly']
      )

      service = build('drive', 'v3', credentials=credentials)

      results = service.files().list(
          pageSize=5,
          fields="files(id, name)"
      ).execute()

      files = results.get('files', [])

      if not files:
          print("No files found. Please share a Drive folder with the email above.")
      else:
          print("SUCCESS! Found", len(files), "files:")
          for f in files:
              print("-", f['name'])

      print("Test completed.")